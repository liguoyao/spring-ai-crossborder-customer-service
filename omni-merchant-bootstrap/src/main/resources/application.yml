server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: omni-merchant
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://${MYSQL_HOST:47.111.16.30}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:omni_merchant}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: ${MYSQL_USER:root}
      password: ${MYSQL_PASSWORD:Qgjh@2024}
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: stat,wall
      filter:
        wall:
          enabled: true
          config:
            comment-allow: true
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:r-bp11djv7d4lnne5p6z.redis.rds.aliyuncs.com}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:heMntYjSC3GArYe3hCWGvEEF}
      timeout: 3000ms
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:sk-ws-H.YPEIIPH.KCDi.MEUCIAmNm5P-S9qRcpSnokmd4uYo4dvPU8kEwVkb0WnBIePMAiEA3F3AiXGQMXLyHNScH4ZPKkH15tFL5N-q58QIv_Q_zHE}
      chat:
        connect-timeout: 30s
        read-timeout: 60s
        model: glm-5.3
        base-url: https://ws-8bf265nmnx04mmu8.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        connect-timeout: 30s
        read-timeout: 30s
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5-20251001}
          temperature: 0.3
          maxTokens: 4096
        connect-timeout: 30s
        read-timeout: 60s

springdotenv:
  enabled: ${SPRINGDOTENV_ENABLED:true}
  ignore-if-missing: true
  ignore-if-malformed: true

omnimerchant:
  pgvector:
    url: jdbc:postgresql://${PG_HOST:47.111.16.30}:${PG_PORT:5432}/${PG_DATABASE:omni_merchant}
    username: ${PG_USER:app}
    password: ${PG_PASSWORD:app123456}
    driver-class-name: org.postgresql.Driver
    migration-enabled: ${PG_FLYWAY_ENABLED:true}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  llm:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
  knowledge:
    embedding:
      cache-ttl-hours: 1
      batch-size: 20
    chunking:
      default-size: 500
      default-overlap: 50
    retrieval:
      vector-top-k: 20
      bm25-top-k: 20
      rrf-k: 60
      rerank-top-n: 10
    reranker:
      url: ${RERANKER_URL:http://localhost:8001/rerank}
      timeout-seconds: 5
  integrations:
    encryption-key: ${INTEGRATION_ENCRYPTION_KEY}
  app-base-url: ${APP_BASE_URL:http://localhost:8090}
  eval:
    live-agent-enabled: ${EVAL_LIVE_AGENT_ENABLED:false}
  rag-safety:
    strict: ${RAG_SAFETY_STRICT:true}
  shopify:
    client-id: ${SHOPIFY_CLIENT_ID:}
    client-secret: ${SHOPIFY_CLIENT_SECRET:}
    scopes: ${SHOPIFY_SCOPES:read_products,read_customers,read_orders,read_fulfillments}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:true}
    endpoints: ${ROCKETMQ_ENDPOINTS:47.111.16.30:18081}
    access-key: ${ROCKETMQ_ACCESS_KEY:}
    secret-key: ${ROCKETMQ_SECRET_KEY:}
    ssl-enabled: ${ROCKETMQ_SSL_ENABLED:false}
    request-timeout: ${ROCKETMQ_REQUEST_TIMEOUT:10s}
    topic: ${ROCKETMQ_TOPIC:omni-token-usage}
    tag: ${ROCKETMQ_TAG:daily}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:omni-token-usage-consumer}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: omni-merchant
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLE_RATE:0.0}
  opentelemetry:
    tracing:
      sampler: ${OTEL_TRACING_SAMPLER:always-off}
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.omnimerchant.**.entity

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
    instances:
      llm:
        base-config: default
        sliding-window-size: 10
        wait-duration-in-open-state: 20s
        failure-rate-threshold: 50

admin:
  email: ${ADMIN_EMAIL:1254770191@qq.com}
  password: ${ADMIN_PASSWORD:123456}
  jwt-secret: ${JWT_SECRET:e22575f0eb2462a416dcac0d180b62cc3dd93b3a80b0888f79e8a1e47563c70c}
  jwt-previous-secret: ${JWT_PREVIOUS_SECRET:}
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:2592000000}
  issuer: ${ADMIN_JWT_ISSUER:omnimerchant-admin}
  audience: ${ADMIN_JWT_AUDIENCE:omnimerchant-admin-api}
  widget-issuer: ${WIDGET_JWT_ISSUER:omnimerchant-widget}
  widget-audience: ${WIDGET_JWT_AUDIENCE:omnimerchant-widget-api}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5188,http://127.0.0.1:5188}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.omnimerchant: INFO
