server:
  port: ${SERVER_PORT}

spring:
  application:
    name: omni-merchant
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      filters: stat,wall
      filter:
        wall:
          enabled: true
          config:
            comment-allow: true
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms
  ai:
    model:
      chat: none
      embedding: ${SPRING_AI_MODEL_EMBEDDING}
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    openai:
      api-key: ${DASHSCOPE_EMBEDDING_API_KEY}
      base-url: ${DASHSCOPE_EMBEDDING_BASE_URL}
      embedding:
        connect-timeout: 30s
        read-timeout: 30s
        model: ${DASHSCOPE_EMBEDDING_MODEL}
        dimensions: 1536

springdotenv:
  enabled: true
  ignore-if-missing: true
  ignore-if-malformed: true

omnimerchant:
  pgvector:
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DATABASE}
    username: ${PG_USER}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
    migration-enabled: ${PG_FLYWAY_ENABLED}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  llm:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${DASHSCOPE_BASE_URL}
      model: ${DASHSCOPE_MODEL}
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL}
      model: ${DEEPSEEK_MODEL}
  knowledge:
    embedding:
      cache-ttl-hours: 1
      batch-size: 10
      model: ${DASHSCOPE_EMBEDDING_MODEL}
      base-url: ${DASHSCOPE_EMBEDDING_BASE_URL}
      dimensions: 1536
      cache-version: ${EMBEDDING_CACHE_VERSION}
    chunking:
      default-size: 500
      default-overlap: 50
    retrieval:
      vector-top-k: 20
      bm25-top-k: 20
      rrf-k: 60
      rerank-top-n: 10
    reranker:
      url: ${RERANKER_URL}
      timeout-seconds: 5
  integrations:
    encryption-key: ${INTEGRATION_ENCRYPTION_KEY}
  app-base-url: ${APP_BASE_URL}
  eval:
    live-agent-enabled: ${EVAL_LIVE_AGENT_ENABLED}
  rag-safety:
    strict: ${RAG_SAFETY_STRICT}
  shopify:
    client-id: ${SHOPIFY_CLIENT_ID}
    client-secret: ${SHOPIFY_CLIENT_SECRET}
    scopes: ${SHOPIFY_SCOPES}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED}
    endpoints: ${ROCKETMQ_ENDPOINTS}
    access-key: ${ROCKETMQ_ACCESS_KEY}
    secret-key: ${ROCKETMQ_SECRET_KEY}
    ssl-enabled: ${ROCKETMQ_SSL_ENABLED}
    request-timeout: ${ROCKETMQ_REQUEST_TIMEOUT}
    topic: ${ROCKETMQ_TOPIC}
    tag: ${ROCKETMQ_TAG}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: omni-merchant
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_EXPORT_ENABLED}
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLE_RATE}
  opentelemetry:
    tracing:
      sampler: ${OTEL_TRACING_SAMPLER}
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.omnimerchant.**.entity

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 50
    instances:
      llm:
        base-config: default
        sliding-window-size: 10
        wait-duration-in-open-state: 20s
        failure-rate-threshold: 50

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  jwt-secret: ${JWT_SECRET}
  jwt-previous-secret: ${JWT_PREVIOUS_SECRET}
  jwt-expiration-ms: ${JWT_EXPIRATION_MS}
  refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS}
  issuer: ${ADMIN_JWT_ISSUER}
  audience: ${ADMIN_JWT_AUDIENCE}
  widget-issuer: ${WIDGET_JWT_ISSUER}
  widget-audience: ${WIDGET_JWT_AUDIENCE}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.omnimerchant: INFO
